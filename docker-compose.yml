version: '3.8'
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hand_game_solver_backend
    networks:
      - app-network
    restart: unless-stopped
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hand_game_solver_frontend
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    expose:
      - "3001"

networks:
  app-network:
    driver: bridge
